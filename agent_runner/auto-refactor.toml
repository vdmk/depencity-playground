name = "agent-runner-refactor"
mode = "workspaces"
branch_mode = "incremental"
source_root = "agent_runner/src/agent_runner"
repo = ".."
build_root = ".."
dockerfile = "docker/test/Dockerfile"
log_root = "../out/agent-runner-refactor"
task = """
Simplify the code in your assigned files while preserving public behavior.
Start with the function or method in your assigned files with the highest own_profile.graph.paths.expressions.count.
If you can't make a change, try again within your session with a different perspective. Consider a larger, coherent refactoring across related functions before reporting no change.

Use Depencity to report graph.paths.expressions.count, call.occurrences.total.count, and call.dependencies.external.distinct_count across the full source directory before and after each change. Explain which branches account for the reduction and any tradeoffs.

For each file you change, use Depencity MCP to capture a profile before and after the edit with all scopes included. Report the file's __root__ graph.paths.expressions.count and the number of function scopes before and after. Count methods and nested functions, and exclude modules, classes, and comprehensions.

Use the package and file metrics for reporting only. Measure each coordinator extraction separately using own_profile.graph.paths.expressions.count. Record source_before, source_after, and helper_after. Require both:
source_after + helper_after < source_before
helper_after > source_after
Reject an extraction if the caller only checks a guard or opens a context manager and delegates the entire remaining body to the new helper.

Prefer guard clauses and early returns. Keep them when they make the main path easier to read.

Do not:
- Use assignment expressions (`:=`, the walrus operator) in conditions.
- Replace dict() with a {} literal.
- Replace dict.update() calls with individual key assignments.
- Lower the expression-path count by duplicating an existing operation across branches.
- Replace binary arithmetic expressions with conditionals.
- Replace explicit comparisons with zero with implicit truthiness checks. Keep comparisons such as `result.return_code != 0` and `result.return_code == 0`.
- Extract part of a logical condition into a single-use variable solely to reduce expression paths.
- Replace a Python built-in with a loop, extra branches, or manual bookkeeping solely to reduce call counts. Keep the built-in when it expresses the operation more directly.

Validate with the Docker MCP tool from the repository root using pytest -q agent_runner/tests -p no:cacheprovider --import-mode=importlib -n 2.
Leave changes uncommitted for the runner.
"""

[agent]
workers = 5
iterations = 5
require_unchanged_coverage = true
# Require fewer combined expression paths after extraction, with more in the helper than in the caller.
enforce_extraction_path_limits = true
